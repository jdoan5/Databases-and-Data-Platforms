name: tagline-pipeline

# Unit tests for the Tagline BigQuery pipeline (tagline/pipeline): configuration, the cost guard, the SQL files and
# the incremental script, and since Stage 5 the tag health checks generated from tagging/events.schema.json, the
# anomaly rules (with injected anomalies) and alert delivery against a local HTTP sink on 127.0.0.1.
#
# The contract folder is in the path filter because the tag health SQL is generated from it: a contract change that
# requires a parameter the warehouse has no column for fails here. The site's catalog (the products reference table)
# and the simulator's plan (every campaign it sends must have a cost row) are read by the tests too. No Google Cloud
# access: no secrets, and the tests make no network calls beyond installing packages and the local sink.

on:
  push:
    paths:
      - "tagline/pipeline/**"
      - "tagline/tagging/**"
      - "tagline/site/src/catalog/**"
      - "tagline/simulator/src/plan.js"
      - ".github/workflows/tagline-pipeline.yml"
  pull_request:
    paths:
      - "tagline/pipeline/**"
      - "tagline/tagging/**"
      - "tagline/site/src/catalog/**"
      - "tagline/simulator/src/plan.js"
      - ".github/workflows/tagline-pipeline.yml"
  workflow_dispatch:

# Least privilege: the job only reads the repository.
permissions:
  contents: read

defaults:
  run:
    working-directory: tagline/pipeline

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tagline/pipeline/pyproject.toml

      - name: Install the pipeline and pytest
        run: pip install -e '.[dev]'

      - name: Unit tests (pytest, no BigQuery)
        run: python -m pytest -q
